<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>CW Studio | Collective Writings</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="/styles.css"/></head>
<body><header class="masthead"><a class="wordmark" href="/">Collective <em>Writings</em></a><nav><a href="/">Library</a><a href="/studio.html">Studio</a><a href="#intake">Intake</a></nav><button class="outline" id="sign-out">Sign out</button></header><main><section class="studio-head"><p class="eyebrow">CW Studio</p><h1>Manuscript custody.</h1><p class="lede" id="identity">Checking access...</p></section><section class="rule-section" id="intake"><p class="eyebrow">Secure staging</p><h2>Deposit a source work</h2><form id="deposit-form" class="studio-form"><label>Source filename<input required name="filename" maxlength="120" placeholder="manuscript-draft.txt" /></label><label>Declared rights<input required name="declaredRights" maxlength="500" placeholder="I control the rights to submit this work." /></label><label>Intended title<input name="intendedTitle" maxlength="200" /></label><label>Intended author<input name="intendedAuthor" maxlength="200" /></label><label>Textual source<textarea required name="content" maxlength="5242880" placeholder="Paste manuscript text for this first intake slice."></textarea></label><button class="button" type="submit">Stage source</button><p class="quiet" id="deposit-message" role="status"></p></form></section><section class="rule-section"><p class="eyebrow">Review queue</p><h2>Current custody work</h2><div id="operations-list" class="queue"></div></section></main><script type="module" src="/studio.js"></script></body></html>
